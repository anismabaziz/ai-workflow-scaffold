name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm for OIDC support
        run: npm install -g npm@latest

      # setup-node with registry-url writes an `_authToken` line that expands
      # to empty when NODE_AUTH_TOKEN is unset. Empty auth prevents npm from
      # initiating the OIDC exchange, so strip it before publishing.
      - name: Strip empty _authToken from .npmrc
        run: |
          npmrc="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          sed -i '/_authToken/d' "$npmrc"

      - name: Publish to npm via OIDC
        run: npm publish --access public